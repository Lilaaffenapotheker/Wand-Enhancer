name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  publish-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build release
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wand-Enhancer-Build
          path: |
            artifacts/**
            dist/**
            out/**
            publish/**
            build/**
            **/bin/Release/**
            *.exe
            *.zip
            !**/node_modules/**
